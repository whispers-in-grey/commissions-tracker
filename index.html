<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whispers in Grey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #40281D;
    color: #DDD8B8;
    font-family: 'DM Mono', monospace;
    height: 100vh;
    overflow: hidden;
  }

  .home {
    display: flex;
    height: 100vh;
  }

  .left {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4rem;
    gap: 3rem;
    background: #40281D;
  }

.right {
    width: 50%;
    height: 100%;
    background: #40281D;
    padding: 1.5rem 1.5rem 1.5rem 0;
  }

  .right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 8px;
  }

  .site-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 52px;
    font-weight: 500;
    color: #FFF6E0;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }

  .site-subtitle {
    font-size: 10px;
    color: #DDD8B8;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  nav a {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #DDD8B8;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  nav a:hover { color: #FFF6E0; }
</style>
</head>
<body>

<div class="home">
  <div class="left">
    <div>
      <h1 class="site-title">Whispers<br>in Grey</h1>
      <p class="site-subtitle">Digital Art & Video Games</p>
    </div>
    <nav>
      <a href="digital-art.html">Art</a>
      <a href="games.html">Games</a>
      <a href="commissions.html">Commissions</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
  <div class="right">
    <img src="images/home.PNG" alt="Whispers in Grey">
  </div>
</div>

</body>
</html>
