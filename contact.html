<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Whispers in Grey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #40281D;
    color: #DDD8B8;
    font-family: 'DM Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    padding: 2rem 3rem 1.5rem;
    flex-shrink: 0;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  nav a {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #DDD8B8;
    text-decoration: none;
    transition: color 0.2s ease;
    text-align: center;
  }

  nav a:hover { color: #FFF6E0; }

  nav a.active {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 500;
    color: #FFF6E0;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .divider {
    height: 0.5px;
    background: #463730;
    margin: 0 3rem;
    flex-shrink: 0;
  }

  .page-content {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 2rem;
    gap: 2rem;
    scrollbar-width: thin;
    scrollbar-color: #463730 transparent;
  }

  .page-content::-webkit-scrollbar { width: 4px; }
  .page-content::-webkit-scrollbar-track { background: transparent; }
  .page-content::-webkit-scrollbar-thumb { background: #463730; border-radius: 2px; }

  /* CONTACT BOX */
  .contact-box {
    background: #463730;
    border: 0.5px solid #5a4a40;
    border-radius: 8px;
    padding: 1.5rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 340px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .contact-row:hover { opacity: 0.75; }

  .contact-icon {
    width: 22px;
    height: 22px;
    fill: #DDD8B8;
    flex-shrink: 0;
  }

  .contact-text {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #DDD8B8;
  }

  .contact-divider {
    height: 0.5px;
    background: #5a4a40;
  }

  /* VIDEO */
  .video-wrapper {
    width: 100%;
    max-width: 640px;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
    background: #163028;
    border: 0.5px solid #463730;
  }

  .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .video-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #463730;
  }

  .video-caption {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-style: italic;
    color: #8a7a70;
    letter-spacing: 0.04em;
    text-align: center;
  }
</style>
